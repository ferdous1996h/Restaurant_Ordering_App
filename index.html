<body>
  <main class="app">
    <div class="app__top-banner">
      <img src="./IMG/header.png" alt="" class="app__top-img">
    </div>
    <section class="details_info">
      <!-- <div class="app__card">
        <img src="./IMG/beer.png" alt="" class="app__card-icon">
        <div class="card_info">
          <h2>Pizza</h2>
          <p style="color: #8B8B8B;">pepperoni,mushrom,mozarella</p>
          <h4>$14</h4>
        </div>
        <button class="card-btn">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div> -->
    </section>

    <section class="order__section">
      <h4>Your order</h4>
      <div class="item__box">

    <!-- Popup model -->
     <section class="popup_section">
      <h2>Enter card details</h2>
      <form id="myForm">
        <input type="text" id="name" required placeholder="Enter your name">
        <input type="number" required

      </form>

     <!-- Thank u section -->
      <section class="thank_you--sec">
