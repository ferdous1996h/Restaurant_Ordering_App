<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script defer type="module" src="./script.js"></script>
  <title>resturant-ordering-app</title>
</head>

<body>
  <main class="app dark_Mode">
    <div class="app__top-banner">
      <img src="./IMG/header.png" alt="" class="app__top-img">
      <button class="toggle_Mode">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
          <path
            d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z" />
        </svg>

        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
          <path
            d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z" />
        </svg>

      </button>
    </div>
    <section class="details_info">
      <!-- <div class="app__card">
        <img src="./IMG/beer.png" alt="" class="app__card-icon">
        <div class="card_info">
          <h2>Pizza</h2>
          <p style="color: #8B8B8B;">pepperoni,mushrom,mozarella</p>
          <h4>$14</h4>
        </div>
        <button class="card-btn">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div> -->
    </section>

    <section class="order__section">
      <h4>Your order</h4>
      <div class="item__box">
        <!-- <div class="order_item">
          <p>Pizza<button class="remove_item">❌</button></p>
          <p>$14</p>
        </div>
        <div class="order_item">
          <p>Pizza</p>
          <p>$14</p>
        </div> -->
      </div>
      <hr>
      <div class="order_sum">
        <p>Total price:</p>
        <p>$<span class="net__expense"></span></p>
      </div>

      <button class="order__submit--btn">
        Complete order
      </button>


    </section>
    <!-- Popup model -->
    <section class="popup_section">
      <h2>Enter card details</h2>
      <form id="myForm">
        <input type="text" id="name" required placeholder="Enter your name">
        <input type="number" required placeholder="Enter card number">
        <input type="number" required placeholder="Enter CVV">
        <button type="submit" class="pay__submit">Pay</button>
      </form>
    </section>

    <!-- Thank u section -->
    <section class="thank_you--sec">
      <h3>Thanks, <span class="buyer"></span>! Your order is on its way!</h3>
    </section>
  </main>
</body>

</html>
